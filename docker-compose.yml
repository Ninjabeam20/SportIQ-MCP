# Always-on idle: the process listens; MCP only works on a tool call.
# HARD RULES for the Dell (never violate):
#   - Do not set K_SERVICE (that flag means Cloud Run and trusts spoofable XFF).
#   - Do not copy sportiq-keepwarm (no sidecar, no cron hitting /mcp, no pinger).
# Dockerfile HEALTHCHECK is local liveness, not a keep-warm. restart stays as-is.
services:
  sportiq:
    build: .
    container_name: sportiq
    restart: unless-stopped
    env_file: .env
    environment:
      # K_SERVICE must stay absent. SPORTIQ_LOG_FORMAT=json is the Dell JSON path.
      SPORTIQ_TRANSPORT: http
      PORT: "8080"
      SPORTIQ_LOG_FORMAT: json
      SPORTIQ_TRUST_CLOUDFLARE: "1"
      DISKCACHE_DIR: /var/cache/sportiq
      SPORTIQ_ANALYTICS_JSONL: /var/log/sportiq/events.jsonl
    volumes:
      - sportiq-cache:/var/cache/sportiq
      - sportiq-analytics:/var/log/sportiq
    networks: [apps]
    mem_limit: 1536m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # NO ports: — Caddy reaches sportiq:8080 on the apps network only.

networks:
  apps:
    external: true

volumes:
  sportiq-cache:
  sportiq-analytics:
