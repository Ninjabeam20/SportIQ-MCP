<style>

*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Avenir Next",Avenir,"Segoe UI",sans-serif}a{color:var(--blue)}button,select,input{font:inherit}button,select{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}header{background:white;border-bottom:1px solid var(--rule);padding:22px max(24px,calc((100vw - 1360px)/2)) 0}.brand{display:flex;align-items:center;justify-content:space-between;gap:20px}.mark{display:flex;align-items:center;gap:15px}.symbol{width:42px;height:42px;background:var(--blue);color:white;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800}h1{font-size:25px;letter-spacing:-.6px;margin:0;font-weight:750}.muted,.note{color:var(--muted)}.note{font-size:12px;margin:9px 0 0;max-width:100ch}.brand p{margin:2px 0;font-size:13px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}button,select,input{border:1px solid var(--rule);border-radius:6px;background:white;padding:8px 12px;color:var(--ink)}button.primary{background:var(--blue);color:white;border-color:var(--blue)}nav{display:flex;gap:26px;margin-top:20px;overflow:auto}nav button{padding:12px 1px;background:none;border:0;border-bottom:3px solid transparent;border-radius:0;white-space:nowrap;font-size:14px}nav button[aria-selected=true]{border-bottom-color:var(--blue);color:var(--blue);font-weight:700}main{max-width:1408px;margin:auto;padding:28px 24px 60px}section[hidden]{display:none}h2{font-size:21px;letter-spacing:-.3px;margin:0 0 6px}h3{font-size:15px;margin:0 0 14px;font-weight:700}.section-head{display:flex;justify-content:space-between;align-items:start;gap:24px;margin:0 0 20px}.section-head p{margin:3px 0;max-width:84ch;font-size:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);background:white;border:1px solid var(--rule);border-radius:9px;margin:20px 0;overflow:hidden}.stat{padding:22px 24px;border-right:1px solid var(--rule);min-width:0}.stat:last-child{border:0}.stat .value{font-size:34px;line-height:1.15;font-weight:720;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:9px 0}.stat .label{font-size:13px;font-weight:600}.stat .detail{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin:20px 0}.grid.equal{grid-template-columns:1fr 1fr}.panel{background:white;border:1px solid var(--rule);border-radius:9px;padding:22px;min-width:0}.wide{grid-column:1/-1}.panel-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{display:inline-block;padding:3px 8px;border-radius:5px;background:#e9eef5;color:var(--muted);font-size:11px;white-space:nowrap}.badge.fresh,.badge.cached{color:#11685f;background:#e1f2eb}.badge.stale,.badge.snapshot{color:#81500b;background:#fff0d8}.badge.unavailable{color:var(--red);background:#fae9e8}.callout{border-left:4px solid var(--amber);background:#fff8eb;padding:16px 20px;border-radius:0 7px 7px 0;margin:18px 0}.callout.error{border-color:var(--red);background:#fff0ee}.callout p{margin:4px 0;font-size:14px}.callout strong{font-size:15px}.findings{display:grid;grid-template-columns:1fr 1fr;gap:20px}.finding{padding:18px 0;border-top:1px solid var(--rule)}.finding h3{margin-bottom:6px}.finding p{margin:0;font-size:14px;color:var(--muted)}.plot{width:100%;height:auto;display:block;min-height:150px}.plot text{font-family:inherit;fill:var(--muted);font-size:11px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin:9px 0}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}.bars{display:grid;gap:12px}.barrow{display:grid;grid-template-columns:minmax(90px,1fr) 2fr 65px;align-items:center;gap:12px;font-size:12px}.barrow .name{overflow-wrap:anywhere}.track{height:9px;background:#edf1f7;border-radius:2px;overflow:hidden}.fill{height:100%;background:var(--blue)}.num{text-align:right;font-variant-numeric:tabular-nums}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{font-weight:600;color:var(--muted);background:#f8fafd;text-align:left;padding:11px 10px;white-space:nowrap}td{border-bottom:1px solid #edf0f5;padding:10px;vertical-align:top}td:not(:first-child){font-variant-numeric:tabular-nums}tr:last-child td{border:0}td.tool{font-size:12px;white-space:nowrap}.bad{color:var(--red);font-weight:600}.good{color:var(--teal)}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px}.filters input{flex:1;min-width:180px}.pill{font-size:11px;padding:2px 7px;border-radius:20px;background:#e7f5ee;color:#11685f}.pill.f1{background:#fff0d8;color:#85530b}.pill.cricket{background:#eee8fa;color:#6e4699}.pair{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid #edf0f5;font-size:13px}.pair:last-child{border:0}.pair b{font-variant-numeric:tabular-nums}.people{display:flex;gap:8px;flex-wrap:wrap}.people a{padding:6px 10px;border:1px solid var(--rule);border-radius:5px;font-size:12px;text-decoration:none}.empty{padding:25px 5px;color:var(--muted);font-size:14px}.footer{font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:18px;margin-top:30px}.chart-title{display:flex;justify-content:space-between;gap:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:6px}#connection{font-size:12px}.big-note{font-size:13px;color:var(--muted);max-width:100ch}.source-table td{max-width:410px}.loading{opacity:.5}
@media(max-width:950px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--rule)}.grid,.grid.equal{grid-template-columns:1fr}.brand{align-items:start}.brand .controls{justify-content:flex-end}.findings{grid-template-columns:1fr}nav{gap:20px}}
@media(max-width:600px){header{padding:18px 16px 0}main{padding:22px 16px}.brand{display:block}.brand .controls{justify-content:start;margin-top:15px}.stat{padding:16px}.stat .value{font-size:29px}.panel{padding:17px}.section-head{display:block}.barrow{grid-template-columns:100px 1fr 52px;gap:8px}.note{font-size:11px}h1{font-size:23px}}

<body>
<header><div class="brand"><div class="mark"><div class="symbol" aria-hidden="true">S</div><div><h1>SportIQ analytics</h1><p class="muted">Usage, reach and reliability across both hosting eras</p></div></div><div class="controls"><span id="connection"></span><button id="refresh">Refresh view</button><button id="export">Export analysis</button></div></div>
<nav role="tablist" aria-label="Analytics views"><button role="tab" aria-selected="true" data-tab="overview">Overview</button><button role="tab" aria-selected="false" data-tab="cloudflare">Cloudflare traffic</button><button role="tab" aria-selected="false" data-tab="tools">Tool performance</button><button role="tab" aria-selected="false" data-tab="reach">Downloads & GitHub</button><button role="tab" aria-selected="false" data-tab="history">GCP archive</button><button role="tab" aria-selected="false" data-tab="coverage">Data coverage</button></nav></header>
<main><section id="overview" role="tabpanel"></section><section id="cloudflare" role="tabpanel" hidden></section><section id="tools" role="tabpanel" hidden></section><section id="reach" role="tabpanel" hidden></section><section id="history" role="tabpanel" hidden></section><section id="coverage" role="tabpanel" hidden></section><div class="footer" id="footer"></div></main>
<script>
let DATA = __DATA__;
const $=id=>document.getElementById(id), esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v==null?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:1}), pct=v=>v==null?'—':fmt(v*100)+'%', ms=v=>v==null?'—':v>=1000?fmt(v/1000)+' s':fmt(v)+' ms';
const date=v=>v?String(v).slice(0,10):'not recorded',stamp=v=>v?new Date(v).toLocaleString('en-GB',{timeZone:'UTC',dateStyle:'medium',timeStyle:'short'})+' UTC':'not collected';
const range=s=>date(s.first_ts||s.first_day)+' to '+date(s.last_ts||s.last_day), badge=s=>'<span class="badge '+esc(s?._state||'unavailable')+'">'+esc(({fresh:'Updated',cached:'Within refresh interval',stale:'Stale data',archive:'Historical archive',snapshot:'Browser snapshot',unavailable:'Unavailable'})[s?._state]||'Unavailable')+'</span>';
const stat=(value,label,detail)=>'<div class="stat"><div class="label">'+esc(label)+'</div><div class="value">'+esc(value)+'</div><div class="detail">'+esc(detail)+'</div></div>';
const panel=(title,body,source,wide=false)=>'<article class="panel '+(wide?'wide':'')+'"><div class="panel-top"><h3>'+esc(title)+'</h3>'+(source?badge(source):'')+'</div>'+body+'</article>';
const note=text=>'<p class="note">'+esc(text)+'</p>', pairs=rows=>rows.map(([a,b])=>'<div class="pair"><span>'+esc(a)+'</span><b>'+esc(b)+'</b></div>').join('');
const table=(headers,rows)=>'<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
function bars(obj,color='#205bb2',maxRows=12){let rows=Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]).slice(0,maxRows),max=Math.max(...rows.map(r=>r[1]),1);return rows.length?'<div class="bars">'+rows.map(([k,v])=>'<div class="barrow"><span class="name">'+esc(k)+'</span><div class="track"><div class="fill" style="width:'+Math.max(1,100*v/max)+'%;background:'+color+'"></div></div><span class="num">'+fmt(v)+'</span></div>').join('')+'</div>':'<div class="empty">No recorded data for this view.</div>'}
function chart(series){const dates=[...new Set(series.flatMap(s=>Object.keys(s.data||{})))].sort();if(!dates.length)return '<div class="empty">No retained daily data.</div>';const start=Date.parse(dates[0]),end=Date.parse(dates.at(-1)),max=Math.max(1,...series.flatMap(s=>Object.values(s.data||{}))),W=730,H=235,left=45,right=15,top=15,bottom=32,x=d=>left+(Date.parse(d)-start)/Math.max(86400000,end-start)*(W-left-right),y=v=>H-bottom-v/max*(H-top-bottom);let svg='';for(let i=0;i<4;i++){const val=max*i/3,yy=y(val);svg+='<line x1="'+left+'" x2="'+(W-right)+'" y1="'+yy+'" y2="'+yy+'" stroke="#e4eaf2"/><text x="'+(left-7)+'" y="'+(yy+4)+'" text-anchor="end">'+fmt(val)+'</text>'}for(const s of series){let prev=null,d='';for(const day of Object.keys(s.data||{}).sort()){const xx=x(day),yy=y(s.data[day]);d+=(prev&&Date.parse(day)-Date.parse(prev)<=86400000?' L':' M')+xx+','+yy;svg+='<circle cx="'+xx+'" cy="'+yy+'" r="2.4" fill="'+s.color+'"><title>'+esc(day+' · '+s.name+': '+fmt(s.data[day]))+'</title></circle>';prev=day}svg+='<path d="'+d+'" stroke="'+s.color+'" stroke-width="2" fill="none"/>'}svg+='<text x="'+left+'" y="'+(H-5)+'">'+dates[0]+'</text><text x="'+(W-right)+'" y="'+(H-5)+'" text-anchor="end">'+dates.at(-1)+'</text>';return '<svg class="plot" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(series.map(s=>s.name).join(', ')+' by date')+'">'+svg+'</svg><div class="legend">'+series.map(s=>'<span style="--c:'+s.color+'">'+esc(s.name)+'</span>').join('')+'</div>'}
const daily=(s,key)=>Object.fromEntries(Object.entries(s.daily||{}).map(([d,v])=>[d,key?v[key]||0:(v.ok||0)+(v.error||0)+(v.unknown||0)]));
function overview(){const d=DATA.dell,c=DATA.cloudflare,p=DATA.pypi,r=DATA.runtime,g=DATA.github;
$('overview').innerHTML='<div class="section-head"><div><h2>What the traffic actually means</h2><p class="muted">Edge requests show reach. Tool calls show use. Health checks, crawlers and downloads tell different stories.</p></div>'+badge(d)+'</div>'+
'<div class="stats">'+stat(c.requests_display||'—','Cloudflare requests',c.window?c.window+' · SportIQ hostname':'Not yet collected')+stat(fmt(d.total_calls),'Dell tool calls',range(d)+' · excludes health')+stat(fmt(p.retained_total),'PyPI downloads',range(p)+' · retained history')+stat(fmt(g.forks),'Public forks',fmt(g.stars)+' stars · '+stamp(g._cached_at))+'</div>'+
(c.error_5xx_rate>0?'<div class="callout error"><strong>'+Number(c.error_5xx_rate).toFixed(2)+'% edge 5xx errors in the Cloudflare window</strong><p>Most recorded 5xx responses are labelled 530 DNS Error. The captured last-24-hours view reported '+fmt(c.latest24h?.error_5xx_rate)+'% 5xx. This is a request-weighted error rate, not an uptime percentage.</p></div>':'')+
'<div class="grid">'+panel('Recorded tool activity across both hosting eras',chart([{name:'GCP tool calls',data:daily(DATA.gcp_tools),color:'#205bb2'},{name:'Dell tool calls',data:daily(d),color:'#168479'}])+note('Gaps are dates without retained call events. Overlapping snapshots are deduplicated. No line is drawn across a missing date.'),null)+panel('Dell reliability',pairs([['Successful calls',fmt(d.ok)+' / '+fmt(d.total_calls)],['Failed calls',fmt(d.errors)+' ('+pct(d.error_rate)+')'],['Median tool execution',ms(d.p50_ms)],['p95 / p99 execution',ms(d.p95_ms)+' / '+ms(d.p99_ms)],['Calls over 5 seconds',fmt(d.slow_5s)]])+note('Tool timing includes execution and waiting inside the wrapper; it is not end-to-end client latency.'),d)+panel('Who is invoking tools',bars(d.clients,'#168479')+note('Known crawler and probe labels dominate these calls. Labels come from self-reported user agents; no human user count is established.'),d)+panel('Dell container now',pairs([['Container',r.health||r.status||'Unavailable'],['Memory',r.memory||'—'],['CPU snapshot',r.cpu||'—'],['Process started',stamp(r.started_at)],['Collected',stamp(r._cached_at)]])+note('An instantaneous resource sample, not a CPU trend or uptime history. '+(r._error?'Latest refresh failed: '+r._error:'')),r)+'</div>'+
'<div class="findings"><div class="finding"><h3>Many requests are checks and discovery</h3><p>'+fmt(d.http_get)+' GETs and '+fmt(d.http_other)+' other MCP requests were logged on Dell. Cloudflare shows named liveness bots. These counts cannot be turned into a people count.</p></div><div class="finding"><h3>Failures have different causes</h3><p>'+Object.entries(d.error_codes||{}).map(([k,v])=>fmt(v)+' '+esc(k)).join('; ')+'. Input errors, tool exceptions and Cloudflare HTTP errors are reported separately.</p></div><div class="finding"><h3>Installations and identities are not measured</h3><p>PyPI counts downloads, including repeat and automated downloads. GitHub supplies aggregate visits and clones, plus public fork owners. Hosted traffic is anonymous.</p></div><div class="finding"><h3>Refresh varies by source</h3><p>Dell: five minutes. GitHub: one hour. PyPI: twelve hours (upstream updates daily). Cloudflare: dated browser snapshot. GCP: preserved archive.</p></div></div>';
}
function cloudflare(){const c=DATA.cloudflare;$('cloudflare').innerHTML='<div class="section-head"><div><h2>Cloudflare traffic</h2><p class="muted">'+esc(c.host||'sportiq.utkarshgupta.org')+' · '+esc(range(c))+'</p></div>'+badge(c)+'</div>'+(c._state==='unavailable'?'<div class="empty">Cloudflare data has not been collected.</div>':'<p class="big-note">Captured '+esc(stamp(c._cached_at))+'. '+esc(c.precision)+'</p><div class="stats">'+stat(c.requests_display,'Requests',c.window)+stat(c.data_transfer,'Data served','Includes automated requests')+stat(Number(c.error_5xx_rate).toFixed(2)+'%','5xx response rate','Request-weighted · not uptime')+stat(ms(c.origin_p95_ms),'Origin response p95','Cloudflare HTTP measurement')+'</div><div class="grid equal">'+panel('HTTP response codes',bars(c.statuses,'#b84245',16)+note('404s include discovery requests; 406s can be GET /mcp negotiation responses. 499 means the client closed the request. A 200 can still carry an MCP tool error.'))+panel('Requests by country',bars(c.countries)+note('Request origin geography includes hosting providers, bots and proxies. This does not locate individual users.'))+panel('Top user agents',bars(c.agents,'#168479')+note('Self-reported user-agent labels. Bot labels are evidence of automation, not verified human/bot classification.'))+panel('Top requested paths',bars(c.paths)+note('Discovery paths are not tool invocations. Top lists are partial and rounded.'))+panel('Performance and security',pairs([['Origin p50',ms(c.origin_p50_ms)],['Origin p95',ms(c.origin_p95_ms)],['Origin p99',ms(c.origin_p99_ms)],['Cache hit rate',fmt(c.cache_hit_rate)+'%'],['Mitigated requests',fmt(c.security?.mitigated_requests)],['Cloudflare rate-limit actions',fmt(c.security?.rate_limiting_requests)],['HTTP 429 responses',fmt(c.statuses?.['429 Too Many Requests'])]])+note('Cloudflare rate-limit actions and HTTP 429s are different metrics; 429s can come from the application.'))+panel('Visitors: what is known',pairs([['SportIQ browser pageviews',fmt(c.pageviews)],['SportIQ browser visits',fmt(c.visits)],['Unique people','Not measured'],['Whole-zone visitors / 24h',fmt(c.zone_context?.visitors)]])+note('Zero browser visits does not mean zero MCP users. The whole-zone figure includes every hostname on utkarshgupta.org and cannot be assigned to SportIQ.'))+'</div><p class="big-note">'+esc(c.note)+'</p><a href="'+esc(c.dashboard_url)+'" target="_blank" rel="noopener">Open the filtered Cloudflare dashboard</a>');}
let era='dell',sport='all',query='',sort='calls';
function tools(){const s=DATA[era];$('tools').innerHTML='<div class="section-head"><div><h2>Tool performance</h2><p class="muted">'+esc(range(s))+'. Health-tool calls are counted separately; all sports use the same telemetry rules.</p></div></div><div class="filters"><label>Period <select id="era"><option value="dell">Dell · all retained</option><option value="dell_30d">Dell · last 30 days</option><option value="gcp_tools">GCP · archived calls</option><option value="combined">Combined retained history</option></select></label><label>Sport <select id="sport"><option value="all">All sports</option><option value="football">Football</option><option value="f1">F1</option><option value="cricket">Cricket</option><option value="cross-sport">Cross-sport</option></select></label><label>Sort <select id="sort"><option value="calls">Calls</option><option value="errors">Errors</option><option value="p95_ms">p95 latency</option><option value="max_ms">Maximum latency</option></select></label><input id="search" aria-label="Search tools" placeholder="Find a tool…"></div><div class="stats">'+stat(fmt(s.total_calls),'Tool calls','Excludes '+fmt(s.health_calls)+' health calls')+stat(pct(s.error_rate),'Tool failure rate',fmt(s.errors)+' error envelopes or exceptions')+stat(ms(s.p95_ms),'p95 execution time',fmt(s.latency_samples)+' measured calls')+stat(fmt(s.slow_5s),'Calls over 5 seconds',fmt(s.slow_10s)+' exceeded 10 seconds')+'</div><div class="panel" id="tool-table"></div><div class="grid equal">'+panel('Calls by day',chart([{name:'Successful',data:daily(s,'ok'),color:'#168479'},{name:'Failed',data:daily(s,'error'),color:'#b84245'}]))+panel('Client software',bars(s.clients)+note('Labels identify software, not users. Local maintainer and automated tool calls cannot be reliably excluded.'))+panel('Calls by sport',bars(Object.fromEntries(['football','f1','cricket','cross-sport'].map(sport=>[sport,s.tools.filter(t=>t.sport===sport).reduce((n,t)=>n+t.calls,0)])),'#168479')+note('Zero means no retained tool calls for that sport, not proof of no installs.'))+panel('Day of week (UTC)',bars(Object.fromEntries(['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map((day,i)=>[day,s.weekdays_utc[i]]))))+panel('Error codes',bars(s.error_codes,'#b84245')+note('Some archived GCP raw events omit the error code; original GCP aggregate codes are preserved on the archive tab.'))+panel('Data sources used',bars(s.sources,'#168479'))+panel('Time of day (UTC)',bars(Object.fromEntries(s.hours_utc.map((v,i)=>[String(i).padStart(2,'0')+':00',v])),'#205bb2',24)+note('Ranked by call count. UTC is used consistently across both hosting eras.'))+panel('Recent tool failures',table(['Time (UTC)','Tool','Error'],s.recent_errors.map(e=>[e.ts?.replace('T',' ').slice(0,19),e.tool,e.error||'Unrecorded']))+note('Most recent 25 failures from the selected retained window.'))+panel('Client-by-tool matrix',table(['Tool',...Object.keys(s.matrix)],s.tools.map(t=>[t.tool,...Object.keys(s.matrix).map(c=>fmt(s.matrix[c][t.tool]||0))])),null,true)+panel('Slowest tool calls',table(['Time (UTC)','Tool','Latency','Outcome'],s.slowest.map(e=>[e.ts?.replace('T',' ').slice(0,19),e.tool,ms(e.latency_ms),e.success?'Success':'Failed'])),null,true)+'</div>';
$('era').value=era;$('sport').value=sport;$('sort').value=sort;$('search').value=query;$('era').onchange=e=>{era=e.target.value;tools()};$('sport').onchange=e=>{sport=e.target.value;toolTable()};$('sort').onchange=e=>{sort=e.target.value;toolTable()};$('search').oninput=e=>{query=e.target.value;toolTable()};toolTable();}
function toolTable(){let rows=DATA[era].tools.filter(t=>(sport==='all'||t.sport===sport)&&t.tool.toLowerCase().includes(query.toLowerCase())).sort((a,b)=>(b[sort]??-1)-(a[sort]??-1));$('tool-table').innerHTML=rows.length?'<div class="table-wrap"><table><thead><tr>'+['Tool','Sport','Calls','Errors','Error rate','Average','p50','p95','p99','Maximum','Stale'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(t=>'<tr><td class="tool">'+esc(t.tool)+'</td><td><span class="pill '+esc(t.sport)+'">'+esc(t.sport)+'</span></td><td>'+fmt(t.calls)+'</td><td class="'+(t.errors?'bad':'')+'">'+fmt(t.errors)+'</td><td>'+pct(t.errors/t.calls)+'</td><td>'+ms(t.avg_ms)+'</td><td>'+ms(t.p50_ms)+'</td><td>'+ms(t.p95_ms)+'</td><td>'+ms(t.p99_ms)+'</td><td>'+ms(t.max_ms)+'</td><td>'+fmt(t.stale)+'</td></tr>').join('')+'</tbody></table></div>'+note('Nearest-rank percentiles calculated from individual recorded latencies. Small samples make p99 close to the maximum. Staleness is only known where recorded.'):'<div class="empty">No tools match these filters.</div>'}
function reach(){const g=DATA.github,p=DATA.pypi,h=DATA.github_history;$('reach').innerHTML='<div class="section-head"><div><h2>Downloads & repository reach</h2><p class="muted">Downloads, clone operations, distinct cloners and public forks are separate measures.</p></div>'+badge(g)+'</div><div class="stats">'+stat(fmt(p.retained_total),'Retained PyPI downloads',range(p))+stat(fmt(g.views?.unique),'GitHub unique visitors','Latest fetched 14-day window')+stat(fmt(g.clones?.total),'GitHub clones','Latest fetched 14-day window')+stat(fmt(g.clones?.unique),'GitHub unique cloners','Not a list of people')+'</div><div class="grid equal">'+panel('PyPI downloads by date',chart([{name:'Downloads without mirrors',data:p.daily,color:'#205bb2'}])+note('Known mirrors excluded. Retained total merges dates, not snapshot totals. Missing dates remain gaps; repeat downloads and CI are not installations.'),p)+panel('GitHub views and clones',chart([{name:'Views',data:h.views,color:'#168479'},{name:'Clones',data:h.clones,color:'#205bb2'}])+note('Latest observations replace overlapping dates. Unsaved periods older than GitHub’s 14-day retention are unavailable. Do not sum daily unique counts to estimate people.'),g)+panel('Retained distribution totals',pairs([['PyPI downloads in the last 30 completed UTC dates',fmt(p.last30_total)],['Retained GitHub page views',fmt(Object.values(h.views).reduce((a,b)=>a+b,0))],['Retained GitHub clone operations',fmt(Object.values(h.clones).reduce((a,b)=>a+b,0))],['Latest GitHub traffic dates',date(g.clones?.days?.[0])+' to '+date(g.clones?.days?.at(-1))]])+note('These retained GitHub totals combine archived and current observed dates only; the unsaved gap is unknown. Downloads are not unique installations.'))+panel('Public fork owners',g.fork_owners?.length?table(['Account','Fork URL','Created'],g.fork_owners.map(r=>[r.login,r.url,date(r.created_at)])):note(g.endpoint_errors?.fork_owners||'No public fork owners in the current response.'),g)+panel('Stars and watchers',pairs([['Stars',fmt(g.stars)],['Watchers',fmt(g.watchers)],['Public forks',fmt(g.forks)],['Last repository push',stamp(g.pushed_at)]])+'<div class="people">'+(g.stargazers||[]).map(p=>'<a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.login)+'</a>').join('')+'</div>'+note('Public stargazers are not evidence of installation or product use.'),g)+panel('GitHub referrers',table(['Referrer','Views','Unique visitors'],(g.referrers||[]).map(r=>[r.referrer,fmt(r.count),fmt(r.uniques)]))+note(g.endpoint_errors?.referrers||'Top referring sites returned by GitHub; not a complete attribution report.'),g)+panel('Popular repository pages',table(['Path','Views','Unique visitors'],(g.paths||[]).map(r=>[r.path,fmt(r.count),fmt(r.uniques)]))+note(g.endpoint_errors?.paths||'Current traffic window only.'),g)+panel('Release asset downloads',table(['Release','Published','Asset downloads'],(g.releases||[]).map(r=>[r.tag,date(r.published),fmt(r.downloads)]))+note('Release assets are separate from PyPI packages. Source zip/tarball download counts are not supplied here.'),g)+panel('What cannot be identified',pairs([['Named cloners','GitHub does not provide them'],['Named repository visitors','GitHub does not provide them'],['Verified installations','Not instrumented'],['Unique hosted MCP users','No user identity is logged']]))+'</div>';}
function history(){const c=DATA.gcp,t=DATA.gcp_tool_details,h=DATA.gcp_http;const counts=c.counts_by_day||{};$('history').innerHTML='<div class="section-head"><div><h2>GCP history, preserved</h2><p class="muted">The original dashboard and cache remain intact. GCP collectors are not queried; the project has been shut down.</p></div>'+badge(c)+'</div><div class="stats">'+stat(fmt(c.total_requests),'Archived HTTP requests',range(c))+stat(fmt(t.total_calls),'Archived tool calls','Includes health calls · '+range(t))+stat(fmt(t.total_error),'Archived tool failures',pct(t.error_rate)+' · original aggregate')+stat(fmt(c.billable_hours)+' h','Historical billable time','Cloud Run only')+'</div><div class="grid equal">'+panel('Cloud Run HTTP requests',chart(['2xx','3xx','4xx','5xx'].map((k,i)=>({name:k,data:Object.fromEntries(Object.entries(counts).map(([d,v])=>[d,v[k]||0])),color:['#168479','#205bb2','#b86b12','#b84245'][i]}))))+panel('Archived HTTP latency',chart([{name:'HTTP p50 (ms)',data:c.p50,color:'#205bb2'},{name:'HTTP p99 (ms)',data:c.p99,color:'#b84245'}])+note('Cloud Monitoring HTTP latency is not directly comparable to instrumented tool execution latency.'))+panel('Original error-code distribution',bars(t.error_codes,'#b84245'))+panel('Historical client software',bars(t.clients)+note('Exact archived client labels and totals; the tool view recomputes metrics excluding health calls.'))+panel('GCP resources',chart([{name:'Billable hours / day',data:Object.fromEntries(Object.entries(c.billable_s||{}).map(([d,v])=>[d,v/3600])),color:'#205bb2'}]))+panel('Archived HTTP status totals',bars(c.code_totals,'#b86b12'))+panel('Startup latency',chart([{name:'Startup p99 (ms)',data:c.startup_p99_ms,color:'#b84245'}]))+panel('Archived HTTP client labels',bars(h.client_buckets||h.buckets))+panel('CPU and memory utilization',chart([{name:'CPU p99 (%)',data:Object.fromEntries(Object.entries(c.cpu_p99||{}).map(([d,v])=>[d,v*100])),color:'#205bb2'},{name:'Memory p99 (%)',data:Object.fromEntries(Object.entries(c.mem_p99||{}).map(([d,v])=>[d,v*100])),color:'#b86b12'}]))+panel('Historical context',pairs([['Monitoring window',range(c)],['Tool-log window',range(t)],['Cloud Logging rows',fmt(h.sampled)],['Sponsors at archived capture',fmt(DATA.sponsors_archive.count)],['MRR at archived capture','$'+fmt(DATA.sponsors_archive.mrr_usd)]])+note('Historical sponsorship and billing values are snapshots, not current balances.'))+'</div>';}
function coverage(){const sources=[['Dell logs',DATA.dell,'5 minutes','MCP HTTP events and tool executions; no named user identities.'],['Dell container',DATA.runtime,'5 minutes','Current process health and resource sample; not a continuous uptime history.'],['GitHub',DATA.github,'1 hour','Views and clones: 14-day API window. Old unsaved days cannot be reconstructed.'],['PyPI',DATA.pypi,'12 hours','Upstream daily download statistics; 180-day API retention.'],['Cloudflare',DATA.cloudflare,'Browser snapshot','Host-filtered request analytics; rounded values, partial top lists.'],['GCP Monitoring',DATA.gcp,'Frozen archive','Historical retained Monitoring metrics; no requests to deleted GCP.']];$('coverage').innerHTML='<div class="section-head"><div><h2>Data coverage & refresh</h2><p class="muted">Every number has a source and a time window. Missing measurements remain unavailable.</p></div></div><div class="panel source-table">'+table(['Source','State','Last successful collection (UTC)','Refresh policy','Coverage'],sources.map(([name,s,ttl,n])=>[name,s._state,stamp(s._cached_at),ttl,n+(s._error?' Latest refresh: '+s._error+'.':'')]))+'</div><div class="grid equal">'+panel('How the eras are combined',note('GCP and Dell call events are combined after deduplicating overlapping exports within each era. Repeated identical events within an export keep their multiplicity. Health-tool calls are excluded from product usage counts. Daily download and traffic observations replace overlapping days rather than being added.')+pairs([['Combined non-health tool calls',fmt(DATA.combined.total_calls)],['GCP invalid JSONL lines',fmt(DATA.gcp_tools.invalid_lines)],['Dell invalid JSONL lines',fmt(DATA.dell.invalid_lines)]]))+panel('Limits of interpretation',note('The product is anonymous. Counts include maintainer tests, automated discovery and bots. User-agent names are self-reported. The data does not identify unique people, verified installations, or named cloners. HTTP GETs can include legitimate stream/poll requests as well as probes.')+note('Cloudflare and Dell count different stages of traffic. Requests blocked at the edge never reach Dell; local health checks never cross Cloudflare. Different windows must not be summed.'))+panel('Use and refresh',note('Run .venv/bin/python scripts/dashboard_live.py --refresh --serve. Open http://127.0.0.1:8765. The page checks for updated aggregate data every minute. Collection respects each source’s cache interval. The static dashboard_live.html works offline.')+note('Cloudflare was read from the signed-in browser and is a dated snapshot, not an unattended feed. Use its dashboard link for current values. The original scripts/dashboard.py, template, dashboard.html and archive cache are preserved.'))+panel('Metric references',DATA.sources.map(s=>'<p><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+'</a></p>').join(''))+'</div>';}
function render(){overview();cloudflare();tools();reach();history();coverage();$('footer').textContent='Generated '+stamp(DATA.generated_at)+'. Local analysis only. Reporting times use UTC. No raw IP addresses or credentials are embedded.';$('connection').innerHTML=(location.protocol==='file:'?'Offline file':'<span class="dot"></span>Local dashboard')}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));document.querySelectorAll('main section').forEach(s=>s.hidden=s.id!==b.dataset.tab)});
async function refresh(){if(location.protocol==='file:'){$('connection').textContent='Offline snapshot · run the local server to refresh';return}try{const r=await fetch('/data.json');if(!r.ok)throw Error();DATA=await r.json();render()}catch{$('connection').textContent='Local refresh unavailable · displaying last data'}}
$('refresh').onclick=refresh;$('export').onclick=()=>{const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sportiq-analysis-'+date(DATA.generated_at)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();if(location.protocol!=='file:')setInterval(refresh,60000);
</script>
