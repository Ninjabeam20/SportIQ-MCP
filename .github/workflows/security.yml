name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Sync deps
        run: uv sync --extra dev
      - name: Audit dependencies for known CVEs
        # --skip-editable: skip local package (not on PyPI yet); --strict cannot
        # coexist with --skip-editable (strict fails on any skip). Fail-closed
        # for all other transitive deps still applies via non-zero exit on any CVE.
        # CVE-2025-69872: diskcache pickle RCE — acceptable risk (local-only cache).
        # GHSA-6v7p-g79w-8964: msgpack — fix is 1.2.1 but signalrcore (fastf1's
        # live-timing client) pins msgpack below it. msgpack IS shipped: the image
        # installs --extra f1 (fastf1 → signalrcore → msgpack). Accepted because
        # SportIQ never opens fastf1's live-timing (SignalR) client, the only
        # msgpack decode path. Drop the ignore when signalrcore unpins.
        # pyjwt: transitive via mcp; SportIQ never calls jwt; no fixed release as of 2026-10-22 — re-check monthly.
        run: uv run pip-audit --skip-editable --ignore-vuln CVE-2025-69872 --ignore-vuln GHSA-6v7p-g79w-8964 --ignore-vuln PYSEC-2026-4146
      - name: Audit what the image ships (--extra f1, no dev)
        # The Dockerfile installs --extra f1; the step above audits --extra dev only.
        run: |
          uv export --frozen --no-dev --extra f1 --no-hashes -o shipped-requirements.txt
          uvx pip-audit -r shipped-requirements.txt --ignore-vuln CVE-2025-69872 --ignore-vuln GHSA-6v7p-g79w-8964 --ignore-vuln PYSEC-2026-4146

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Sync deps
        run: uv sync --extra dev
      - name: Static security analysis
        run: uv run bandit -r src -ll --quiet

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Sync deps
        run: uv sync --extra dev
      - name: Verify build artifacts exclude sensitive paths
        run: uv run python scripts/check_release_build.py
