name: release

on:
  push:
    tags: ["v*"]

# Never run two releases concurrently; do NOT cancel an in-flight publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi   # OIDC trust binding must name this env in PyPI publisher config
    permissions:
      id-token: write   # OIDC Trusted Publishing (ADR-0010)
      contents: read    # actions/checkout requires this
    steps:
      - uses: actions/checkout@v4

      - name: Install CBC solver
        # dream11_solver.py calls COIN_CMD(), which needs a `cbc` binary on PATH.
        run: sudo apt-get update && sudo apt-get install -y coinor-cbc

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Pin Python
        run: uv python install 3.13

      - name: Sync deps
        run: uv sync --locked --extra dev --python 3.13

      - name: Lint (release quality gate)
        run: uv run --python 3.13 --extra dev ruff check .

      - name: Test + coverage (release quality gate; a tag can't publish a red tree)
        run: uv run --python 3.13 --extra dev python -m pytest -q --cov=sportiq --cov-fail-under=84

      - name: Audit shipped deps (security gate; same flags as security.yml)
        # security.yml doesn't run on tags, so the release commit is audited here.
        run: |
          uv export --frozen --no-dev --no-hashes -o shipped-requirements.txt
          uvx pip-audit -r shipped-requirements.txt --ignore-vuln CVE-2025-69872 --ignore-vuln GHSA-6v7p-g79w-8964 --ignore-vuln PYSEC-2026-4146

      - name: Static security analysis (security gate)
        run: uv run --python 3.13 --extra dev bandit -r src -ll -q

      - name: Verify build artifacts (security gate, also builds dist/)
        run: uv run --python 3.13 --extra dev python scripts/check_release_build.py

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
